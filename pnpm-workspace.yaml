packages:
    - 'packages/**'
catalog:
    '@types/node': ^26.6.6
    eslint: ^9.39.5
    typescript: ~6.0.3
# Dependency install scripts run arbitrary code, so each one is an explicit decision.
# Allow only what must compile or download to work; deny optional native speed-ups.
allowBuilds:
    '@parcel/watcher': false
    '@prisma/engines': true
    # cpu-features, ssh2: optional native crypto speed-ups for ssh2, which testcontainers
    # only uses for Docker over SSH. Pure-JS fallback is fine. protobufjs: postinstall is a
    # version check only.
    cpu-features: false
    esbuild: true
    prisma: true
    protobufjs: false
    ssh2: false
# Accepted vulnerability risks (ADR 0011). Each entry needs a reason and a review date.
# Only for advisories that cannot be fixed inside the declared version ranges and that do
# not reach production. Re-check with `pnpm audit` on or before the review date.
audit:
    ignore:
        # minimatch ReDoS ("globparts amplification"), fixed only in >=11. Pulled in by the
        # ESLint/typescript-eslint toolchain, which declares ^3/^5/^9/^10, so forcing 11 could
        # break it. Dev-only; inputs are our own source globs. Review: 2027-02-01.
        - GHSA-g3hv-75wg-m249
        # glob AbortSignal bypass, fixed only in >=14. Pulled in by testcontainers > archiver.
        # Dev-only (integration tests); no untrusted input. Review: 2027-02-01.
        - GHSA-3g3m-2fjr-6pw4
