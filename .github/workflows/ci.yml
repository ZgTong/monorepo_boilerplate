# Continuous integration: every pull request and every push to main must pass these checks.
name: CI

on:
    # pull_request (not pull_request_target): runs from forks get a read-only token and no secrets.
    pull_request:
    push:
        branches: [main]

# Least privilege: the GITHUB_TOKEN can only read the repository. Jobs that need more
# (e.g. deployment in Phase 2) must ask for it explicitly at job level.
permissions:
    contents: read

# PRs: one group per PR ref, so a new push cancels the previous run of the same PR.
# main: one group per commit SHA. A concurrency group holds at most one running and one
# pending run, and a newly queued run always replaces the pending one (even without
# cancel-in-progress), so a shared group would drop CI results for some merged commits.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-24.04
        # The default is 360 minutes; a hung step should fail fast instead of burning runner minutes.
        timeout-minutes: 15
        steps:
            # Actions are pinned to full commit SHAs because tags can be moved (supply-chain attacks
            # such as tj-actions/changed-files, 2025). The trailing comment records the version.
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Do not leave the token in .git/config, where later steps (including
                  # dependency install scripts) could read it. This job never pushes.
                  persist-credentials: false

            # pnpm, Node.js and a frozen install, shared with the other jobs.
            # GitHub now recommends the self-repository form `$/...`, but actionlint 1.7.12
            # rejects it. Switch (and drop the ignore) once actionlint supports it.
            - name: Set up toolchain
              uses: ./.github/actions/setup # zizmor: ignore[self-repository]

            # Cheapest checks first so a failing run stops early (fail fast).
            # Each step calls the same root script a developer runs locally.
            - name: Check formatting
              run: pnpm format

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

    # Runs in parallel with Verify: it needs Docker for Testcontainers (preinstalled on
    # GitHub-hosted Ubuntu runners) and is slower, so it is kept out of the fast job (ADR 0010).
    integration:
        name: Integration tests
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up toolchain
              uses: ./.github/actions/setup # zizmor: ignore[self-repository]

            - name: Integration tests
              run: pnpm test:integration
